
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login | Online Quiz System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-card {
            width: min(420px, 92%);
            margin: 50px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        }

        .login-card label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        .login-card input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
        }

        .login-card button {
            width: 100%;
            margin-top: 22px;
        }

        #loginMessage {
            margin-top: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Teacher Login</h1>
        <p>Online Quiz and Examination System</p>
    </header>

    <main class="login-card">
        <h2>Sign in</h2>
        <p>Enter your teacher credentials to view student results.</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                maxlength="100"
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                maxlength="200"
            >

            <button id="loginButton" type="submit">Log in</button>
        </form>

        <p id="loginMessage" role="status"></p>
        <p><a href="/">Back to Student Quiz</a></p>
    </main>

    <script src="teacher-login.js"></script>
</body>
</html>
