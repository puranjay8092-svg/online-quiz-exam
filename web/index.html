<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz and Examination System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Online Quiz System</h1>
        <p>Test your knowledge. Track your progress.</p>
    </header>

    <main>
        <section class="panel" id="welcome">
            <h2>Welcome, Student!</h2>
            <p>Enter your details to begin the examination.</p>

            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" placeholder="Enter your name" required>

            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" placeholder="Enter your student ID" required>

            <button type="button" id="startBtn">Start Quiz</button>
        </section>

        <p id="status" role="status">Website interface loaded successfully.</p>

        <form id="quizForm" hidden>
            <div id="questions"></div>
            <button type="submit">Submit Answers</button>
        </form>
    </main>

    <script src="app.js"></script>
</body>

</html>
